[package]
name = "jupiter-lend-substreams"
version = "0.1.0"
edition = "2021"
description = "Substreams for Jupiter Lend (Fluid-based lending & borrowing on Solana): Earn, Borrow vaults, liquidations, liquidity layer, rates, revenue, rewards, Lend DEX"
license = "MIT"
repository = "https://github.com/PaulieB14/jupiter-lend-substreams"
keywords = ["solana", "jupiter", "lending", "substreams", "fluid"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.8.0"
substreams-solana = "0.16.0"
substreams-database-change = "5.0.0"
buffa = "0.9.2"
buffa-types = "0.9.2"
anyhow = "1.0"
bs58 = "0.5"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 'z'
strip = true
